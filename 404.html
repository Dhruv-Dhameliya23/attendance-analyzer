<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Analyzer</title>
  <script>
    // GitHub Pages Clean Route Recovery Engine
    (function () {
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      var lastSegment = segments.length ? segments[segments.length - 1] : '';

      // If user visited a clean URL without .html (e.g. /browsers, /sidepanel, /faq, /payment)
      if (lastSegment && !lastSegment.includes('.')) {
        var targetFile = lastSegment + '.html' + window.location.search + window.location.hash;
        window.location.replace(targetFile);
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 60px 20px; background: #f8fafc; color: #0f172a;">
  <p style="color: #64748b; font-size: 15px; font-weight: 600;">Loading...</p>
</body>
</html>
